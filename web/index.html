      // Initialize Flutter
      const flutter = await new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = 'flutter.js';
        script.async = true;
        script.onload = () => resolve(window.flutter);
        script.onerror = reject;
        document.body.appendChild(script);
      });

      try {
        await flutter.load();
        await window.flutterWebRenderer;
      } catch (e) {
        console.error('Failed to load Flutter:', e);
      }
    });
  </script>
